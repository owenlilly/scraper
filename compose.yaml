# Local stack for the hosted API: Postgres and the API. The web app (Next.js) runs separately; see web/README.md.
# Start with: podman-compose up --build
services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scraper
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraper"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Containerfile
    env_file: .env
    environment:
      SCRAPER_DATABASE_URL: postgresql://scraper:${POSTGRES_PASSWORD}@db:5432/scraper
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    build:
      context: .
      dockerfile: Containerfile
    command: ["/app/.venv/bin/python", "-m", "scraper.pipeline", "worker"]
    env_file: .env
    environment:
      SCRAPER_DATABASE_URL: postgresql://scraper:${POSTGRES_PASSWORD}@db:5432/scraper
      SCRAPER_PIPELINE_BLOB_DIR: /data/blobs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - blobs:/data/blobs

volumes:
  dbdata:
  blobs:
