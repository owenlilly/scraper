[project]
name = "scraper"
version = "0.1.0"
description = "Page Chat: tell a model what to collect from a website, and get a table back"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langchain>=1.4,<2",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "openai>=3.27.0",
    "psycopg[binary,pool]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "python-dotenv>=1.2,<2",
    "rank-bm25>=0.2.2",
    "scrapling[fetchers]>=0.4.15",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore:Pydantic serializer warnings:UserWarning"]
