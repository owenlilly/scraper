# Only for the alembic command line: alembic -c src/scraper/pipeline/alembic.ini revision --autogenerate -m "what changed"
# (`make pipeline-revision` does this.) The app itself runs migrations through scraper.pipeline.migrate and ignores this file's paths.
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
